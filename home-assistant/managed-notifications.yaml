counter:
  alexa_actionable_request:
    name: Alexa actionable request sequence
    restore: true
input_text:
  alexa_actionable_pending:
    max: 255
    initial: ''
  alexa_actionable_completed:
    max: 255
    initial: ''
  alexa_actionable_group_silence:
    max: 255
    initial: ''
script:
  activate_alexa_actionable_notification_managed:
    alias: Activate managed Alexa actionable notification
    description: Queue questions; fan out to selected devices and emit the first answer or an overall timeout.
    fields:
      text:
        name: Question
        description: Question to speak. Existing message callers are also supported.
        selector:
          text: {}
      message:
        name: Message (legacy alias)
        selector:
          text: {}
      event_id:
        name: Event ID
        required: true
        selector:
          text: {}
      alexa_device:
        name: Alexa Media Player entity
        selector:
          entity:
            filter:
            - integration: alexa_media
              domain: media_player
      device_id:
        name: Alexa Devices device
        selector:
          device:
            filter:
            - integration: alexa_devices
      transport:
        name: Launch method
        default: alexa_media
        selector:
          select:
            options:
            - alexa_media
            - alexa_devices
      invocation_name:
        name: Skill invocation name (Alexa Devices)
        default: actionable notifications
        selector:
          text: {}
      suppress_confirmation:
        name: Suppress Okay
        default: false
        selector:
          boolean: {}
      timeout_seconds:
        name: Answer deadline (seconds)
        default: 60
        selector:
          number:
            min: 1
            max: 600
            mode: box
      confirmation_yes:
        name: Confirmation Yes
        description: Optional reply; an explicit empty string is silent.
        selector:
          text: {}
      confirmation_no:
        name: Confirmation No
        description: Optional reply; an explicit empty string is silent.
        selector:
          text: {}
      targets:
        name: Device targets
        description: 'Up to ten target objects. Each has transport and alexa_device or device_id; optional screen: true.'
        default: []
        selector:
          object: {}
      audio_only:
        name: Avoid configured screen devices
        default: false
        selector:
          boolean: {}
    sequence:
    - variables:
        selection_json: '{% set ns = namespace(valid=true, ids=[], targets=[]) %}

          {% set raw = targets | default([]) %}{% set items = raw | from_json(none) if raw is string else raw %}

          {% if items is none %}{% set ns.valid = false %}{% set items = [] %}{% elif not items %}{% set items = [{''transport'':
          transport | default(''alexa_media''), ''alexa_device'': alexa_device | default(''''), ''device_id'': (device_id
          if device_id is string else '''')}] %}{% endif %}

          {% if items is string or items is mapping or items is not iterable %}{% set ns.valid = false %}

          {% else %}{% for item in items %}

          {% if item is not mapping %}{% set ns.valid = false %}

          {% else %}{% set method = item.get(''transport'', ''alexa_media'') %}

          {% set identity = item.get(''device_id'') if method == ''alexa_devices'' else item.get(''alexa_device'') %}

          {% if item.get(''screen'', false) is not boolean or method not in [''alexa_media'', ''alexa_devices''] or identity
          is not string or not identity or (method == ''alexa_media'' and not identity.startswith(''media_player.'')) %}{%
          set ns.valid = false %}

          {% elif not (audio_only | default(false) | bool and item.get(''screen'', false)) and [method, identity] not in ns.ids
          %}

          {% set ns.ids = ns.ids + [[method, identity]] %}{% set ns.targets = ns.targets + [item] %}

          {% endif %}{% endif %}{% endfor %}{% endif %}

          {{ {''valid'': ns.valid and 0 < ns.targets | length <= 10, ''targets'': ns.targets} | to_json }}'
    - variables:
        selection: '{{ selection_json | from_json if selection_json is string else selection_json }}'
    - if: '{{ not selection[''valid''] }}'
      then:
      - stop: Supply 1-10 valid distinct targets; audio-only mode requires an unmarked audio target.
        error: true
    - action: counter.increment
      target:
        entity_id: counter.alexa_actionable_request
    - variables:
        question: '{{ text | default(message | default(''''), true) }}'
        correlation_id: '{{ event_id | default('''') }}'
        launch_method: '{{ transport | default(''alexa_media'') }}'
        request_id: '{{ context.id ~ ''-'' ~ states(''counter.alexa_actionable_request'') }}'
        group: '{{ selection[''targets''] | length > 1 }}'
    - if:
      - condition: template
        value_template: '{{ not question or not correlation_id }}'
      then:
      - stop: A question (text or message) and event_id are required.
        error: true
    - variables:
        payload: "{{ {'text': question, 'event': correlation_id, 'request_id': request_id,\n    'suppress_confirmation': suppress_confirmation\
          \ | default(false) | bool} | combine({'group': true} if group else {}) | combine({'confirmation_yes': confirmation_yes}\
          \ if confirmation_yes is defined else {}) | combine({'confirmation_no': confirmation_no} if confirmation_no is defined\
          \ else {}) | to_json }}"
    - if:
      - condition: template
        value_template: '{{ payload | length > 255 }}'
      then:
      - stop: Notification JSON exceeds the input_text limit of 255 characters. Shorten the question or event_id.
        error: true
    - action: input_text.set_value
      target:
        entity_id: input_text.alexa_actionable_notification
      data:
        value: '{{ payload }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.alexa_actionable_pending
      data:
        value: '{{ {''event_id'': correlation_id, ''request_id'': request_id, ''expected'': selection[''targets''] | length}
          | to_json | to_json }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.alexa_actionable_completed
      data:
        value: ''
    - action: input_text.set_value
      target:
        entity_id: input_text.alexa_actionable_group_silence
      data:
        value: ''
    - repeat:
        for_each: '{{ selection[''targets''] }}'
        sequence:
        - action: script.alexa_actionable_launch
          data:
            transport: '{{ repeat.item.get(''transport'', ''alexa_media'') }}'
            device_id: '{{ repeat.item.get(''device_id'', '''') }}'
            alexa_device: '{{ repeat.item.get(''alexa_device'', '''') }}'
            invocation_name: '{{ invocation_name | default(''actionable notifications'') }}'
          continue_on_error: true
    - wait_template: '{{ is_state(''input_text.alexa_actionable_completed'', request_id) }}'
      timeout:
        seconds: '{{ timeout_seconds | default(60) }}'
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ not wait.completed }}'
      then:
      - event: alexa_actionable_notification_timeout
        event_data:
          event_id: '{{ correlation_id }}'
          request_id: '{{ request_id }}'
          event_response: ResponseNone
          event_response_type: ResponseNone
      - wait_template: '{{ is_state(''input_text.alexa_actionable_completed'', request_id) }}'
        timeout: 10
        continue_on_timeout: false
    mode: queued
    max: 10
automation:
- id: alexa_actionable_response_broker
  alias: Alexa managed response broker
  triggers:
  - trigger: event
    event_type: alexa_actionable_notification
  - trigger: event
    event_type: alexa_actionable_notification_timeout
  actions:
  - variables:
      incoming: '{{ trigger.event.data }}'
      pending: '{{ states(''input_text.alexa_actionable_pending'') | from_json({}) }}'
  - condition: template
    value_template: '{{ incoming is mapping and incoming.get(''request_id'') and incoming.get(''request_id'') == pending.get(''request_id'')
      and incoming.get(''event_id'') == pending.get(''event_id'') and ''event_response'' in incoming and incoming.get(''event_response_type'')
      in [''ResponseYes'',''ResponseNo'',''ResponseNone'',''ResponseString'',''ResponseSelect'',''ResponseNumeric'',''ResponseDuration'',''ResponseDateTime'']
      }}'
  - if: '{{ pending.get(''expected'', 1) > 1 and incoming.get(''event_response_type'') == ''ResponseNone'' and trigger.event.event_type
      != ''alexa_actionable_notification_timeout'' }}'
    then:
    - if: '{{ incoming.get(''event_device_key'', '''') | length != 16 }}'
      then:
      - stop: Group silence without device identity waits for the overall deadline.
    - variables:
        silent: '{{ states(''input_text.alexa_actionable_group_silence'') | from_json([]) }}'
    - if: '{{ incoming[''event_device_key''] in silent }}'
      then:
      - stop: Duplicate silent callback.
    - action: input_text.set_value
      target:
        entity_id: input_text.alexa_actionable_group_silence
      data:
        value: '{{ (silent + [incoming[''event_device_key'']]) | to_json | to_json }}'
    - if: '{{ silent | length + 1 < pending[''expected''] }}'
      then:
      - stop: Other group devices can still answer.
  - action: input_text.set_value
    target:
      entity_id: input_text.alexa_actionable_pending
    data:
      value: ''
  - action: input_text.set_value
    target:
      entity_id: input_text.alexa_actionable_completed
    data:
      value: '{{ incoming[''request_id''] }}'
  - event: alexa_actionable_notification_managed
    event_data:
      event_id: '{{ incoming[''event_id''] }}'
      request_id: '{{ incoming[''request_id''] }}'
      event_response: '{{ incoming[''event_response''] }}'
      event_response_type: '{{ incoming[''event_response_type''] }}'
      event_person_id: '{{ incoming.get(''event_person_id'') }}'
      event_device_id: '{{ incoming.get(''event_device_id'') }}'
      raw_event: '{{ incoming }}'
      event_device_key: '{{ incoming.get(''event_device_key'') }}'
  mode: queued
  max: 50
