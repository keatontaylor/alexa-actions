[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"lambda_function.py" = [
    "E402" # Allow imports to come after Setting Vars
]

[tool.black]
line-length = 120

[tool.coverage.run]
branch = true
source = ["lambda"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.pytest.ini_options]
testpaths = ["tests"]
