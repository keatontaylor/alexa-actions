name: "Bug Report"
description: "File a bug report"
title: "[Bug]: "
labels: [ "bug", "triage" ]
assignees:
  - "DEADSEC-SECURITY"
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to fill out this bug report!"
  - type: checkboxes
    id: faqissueread
    attributes:
      label: "Did you check our FAQ and Issue/PR for similar issues?"
      description: >
        Please know that we are not a S&P500 company with a gigantic client support staff so please do you part so we can help everyone with their issues!
        
        FAQs: https://github.com/keatontaylor/alexa-actions/wiki/FAQ#frequently-asked-questions
      options:
        - label: "FAQ checked!"
          required: true
        - label: "Issues/PR checked!"
          required: true
  - type: input
    id: contact
    attributes:
      label: "Contact Details"
      description: "How can we get in touch with you if we need more info?"
      placeholder: "ex. email@example.com"
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
      description: "Also tell us, what did you expect to happen?"
      placeholder: "Tell us what you see!"
      value: "A bug happened!"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Version"
      description: "What version of our software are you running?"
    validations:
      required: true
  - type: dropdown
    id: devices
    attributes:
      label: "What Alexa device are you using?"
      multiple: true
      options:
        - "Echo"
        - "Echo Show"
        - "Fire TV"
        - "Alexa simulator (no device)"
        - "Fire TV Cube"
        - "Other"
  - type: input
    id: otherdevices
    attributes:
      label: "What other Alexa device are you using?"
      description: "Type you device if you selected other in the dropdown"
    validations:
      required: false
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version and launch integration
      description: Include HA Core version and Alexa Media Player or official Alexa Devices.
    validations:
      required: true
  - type: input
    id: hosting-locale
    attributes:
      label: Skill hosting, runtime and locale
      description: Alexa-hosted or self-managed Lambda, runtime if known, model/device locale, and release or PR artifact used.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and request/event results
      description: Include the launch method, spoken answer, intent in Skill I/O, response event type/ID, and script trace. For managed mode include request_id. Redact tokens and personal identifiers.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Relevant log output"
      description: "Include request/response summary and HA HTTP status lines. Remove access tokens, Authorization headers and personal data. Do not paste a full request envelope."
      render: "shell"
