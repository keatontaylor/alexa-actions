name: Home Assistant examples
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check with current HA validators and script engine
        run: >-
          docker run --rm --network none --entrypoint python
          --mount type=bind,source=${{ github.workspace }},target=/repo,readonly
          ghcr.io/home-assistant/home-assistant:2026.9.3
          /repo/scripts/check_home_assistant.py
      - name: Exercise managed timeouts and duplicate handling
        run: >-
          docker run --rm --network none --entrypoint python
          --mount type=bind,source=${{ github.workspace }},target=/repo,readonly
          ghcr.io/home-assistant/home-assistant:2026.9.3
          /repo/scripts/check_managed_notifications.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Node-RED launch example without accounts
        run: node scripts/check_node_red.mjs
