name: Build Linux

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  hosted-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: lambda/requirements.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip check
      - run: python -m pytest tests
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kind: [binary, pure]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: lambda/requirements.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest tests
      - run: python scripts/build_package.py --kind ${{ matrix.kind }}
      - run: python scripts/check_package.py dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: alexa-actions-${{ matrix.kind }}-python313
          path: dist/*.zip
  release:
    if: github.event_name == 'release'
    needs: [hosted-runtime, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release upload "$TAG" dist/*.zip --repo "$REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
