# Inactivity is a reminder, not evidence that a reported bug has been resolved.
name: Mark inactive issues and pull requests
on:
  schedule:
    - cron: '26 13 * * *'
jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 90
          days-before-issue-close: -1
          days-before-pr-close: -1
          exempt-issue-labels: 'bug,confirmed,needs-hardware,awaiting-feedback'
          exempt-pr-labels: 'work-in-progress,awaiting-feedback'
          stale-issue-label: 'no-issue-activity'
          stale-pr-label: 'no-pr-activity'
          stale-issue-message: >-
            This report has been quiet for 90 days. If it still occurs, please share
            the current version and results from docs/troubleshooting.md. Inactivity
            does not mean it is fixed, and this workflow will not close it automatically.
          stale-pr-message: >-
            This PR has been quiet for 90 days. Please share its current validation or
            review needs. It will not be closed automatically for inactivity.
